server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 서비스워커는 항상 최신본을 받도록 캐시 금지
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # PWA 매니페스트 MIME 타입 명시
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    # HTML 진입점은 항상 최신본을 받도록 캐시 금지
    # (해시가 붙은 JS/CSS 에셋은 아래 try_files로 그대로 캐시됨)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
}
