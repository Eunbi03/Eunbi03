events {}

http {
    upstream api {
        server api:3000;
    }

    upstream web {
        server web:80;
    }

    server {
        listen 80;

        # API 요청은 백엔드로
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # SPA 정적 파일 — /admin, /terms 포함 모두 index.html 반환
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
        }
    }
}
