<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeCard 사용 방법</title>
<meta name="description" content="주식회사 케이프라이드 TimeCard 앱 사용 방법 안내">
<style>
  :root{
    --bg:#eef2f6; --surface:#ffffff; --ink:#1e2430; --soft:#5b6472; --line:#d7dee7;
    --accent:#2d6cdf; --shadow:0 2px 10px rgba(30,36,48,.08);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0c1016; --surface:#161c27; --ink:#eef2f8; --soft:#9aa5b5; --line:#2a3342; --accent:#5b92f2; color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-left)) 48px;}
  header{text-align:center;padding:26px 0 6px;}
  .brand{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent);}
  h1{font-size:23px;font-weight:800;margin:4px 0 2px;}
  .sub{font-size:13px;color:var(--soft);margin:0;}

  .tabs{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 12px;display:flex;justify-content:center;}
  .tabrow{display:inline-flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);}
  .tab{appearance:none;border:none;background:none;cursor:pointer;font:inherit;font-weight:800;color:var(--soft);
    padding:11px 22px;border-radius:999px;transition:.15s;font-size:15px;white-space:nowrap;}
  .tab[aria-selected="true"]{background:var(--accent);color:#fff;}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (max-width:420px){ .tab{padding:10px 15px;font-size:14px;} }

  .stage{margin-top:4px;text-align:center;}
  .stage img{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);}
  .missing{display:none;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);color:var(--soft);
    padding:40px 20px;font-size:14px;line-height:1.8;}
  .missing code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 7px;border-radius:6px;color:var(--accent);}
  footer{color:var(--soft);font-size:12px;text-align:center;margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">주식회사 케이프라이드</div>
    <h1>TimeCard 사용 방법</h1>
    <p class="sub">해당하는 휴대폰을 선택하세요</p>
  </header>

  <div class="tabs">
    <div class="tabrow" role="tablist" aria-label="사용 방법 구분">
      <button class="tab" role="tab" data-key="common" aria-selected="true">공통</button>
      <button class="tab" role="tab" data-key="ios" aria-selected="false">🍎 아이폰</button>
      <button class="tab" role="tab" data-key="android" aria-selected="false">📱 갤럭시</button>
    </div>
  </div>

  <div class="stage">
    <img id="viewer" alt="TimeCard 사용 방법" src="common.png">
    <div class="missing" id="missing">
      이미지를 아직 올리지 않았습니다.<br>
      <code>docs/manual</code> 폴더에 아래 파일을 넣어주세요.<br>
      <span id="missingName"></span>
    </div>
  </div>

  <footer>© 주식회사 케이프라이드 · TimeCard</footer>
</div>

<script>
  var IMAGES = {
    common:  "common.png",
    ios:     "ios.png",
    android: "android.png",
  };
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  var viewer = document.getElementById('viewer');
  var missing = document.getElementById('missing');
  var missingName = document.getElementById('missingName');

  viewer.addEventListener('error', function(){
    viewer.style.display = 'none';
    missingName.textContent = decodeURIComponent(viewer.getAttribute('src'));
    missing.style.display = 'block';
  });
  viewer.addEventListener('load', function(){
    viewer.style.display = '';
    missing.style.display = 'none';
  });

  function select(key){
    tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.key === key ? 'true' : 'false'); });
    missing.style.display = 'none';
    viewer.style.display = '';
    viewer.src = IMAGES[key];
    try{ localStorage.setItem('tc-guide-tab', key); }catch(e){}
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ select(t.dataset.key); }); });
  try{ var saved = localStorage.getItem('tc-guide-tab'); if(saved && IMAGES[saved]) select(saved); }catch(e){}
</script>
</body>
</html>
