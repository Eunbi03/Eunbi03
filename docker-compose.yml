version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance}
      POSTGRES_USER: ${DB_USER:-att}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-att}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-attendance}
      DB_USER: ${DB_USER:-att}
      DB_PASSWORD: ${DB_PASSWORD}
      FIREBASE_KEY_PATH: /app/firebase-key.json
    volumes:
      # Firebase 서비스 계정 비밀키 (NAS의 api/firebase-key.json 을 컨테이너로 연결)
      - ./api/firebase-key.json:/app/firebase-key.json:ro
    restart: unless-stopped

  web:
    build: ./web
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 호스트 8080 → 컨테이너 80. 외부 :8443 리버스 프록시가 localhost:8080으로 넘어온다.
      # (호스트 80은 Synology DSM 시스템 nginx가 사용하므로 충돌 금지)
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
